[package]
name = "dev-command-runner"
version = "1.0.2"
description = "Dev Command Runner Desktop Utility"
authors = ["wwwroot"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "dev_command_runner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dev-command-runner"
path = "src/main.rs"

[profile.dev]
incremental = false
codegen-units = 1
