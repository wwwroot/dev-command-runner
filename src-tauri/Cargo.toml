[package]
name = "dev-command-runner"
version = "1.0.3"
description = "Dev Command Runner Desktop Utility"
authors = ["wwwroot"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
] }

[lib]
name = "dev_command_runner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "dev-command-runner"
path = "src/main.rs"

[profile.dev]
incremental = false
codegen-units = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 16
panic = "unwind"
strip = false
